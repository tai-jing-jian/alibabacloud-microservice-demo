apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/service-weight: 'zuul-gateway-svc: 100'
  name: zuul-ingress
spec:
  rules:
  - host: zuul.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zuul-gateway-svc
            port:
              number: 80
status:
  loadBalancer:
    ingress:
    - ip: {{ .Values.slb.zuul}}