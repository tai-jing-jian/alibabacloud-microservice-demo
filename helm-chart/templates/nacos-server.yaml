apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nacos-server
  name: nacos-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos-server
  template:
    metadata:
      labels:
        app: nacos-server
    spec:
      containers:
      - image: nacos/nacos-server:2.0.2
        imagePullPolicy: Always
        name: nacos-server
        ports:
        - containerPort: 8848
          protocol: TCP
        - containerPort: 9848
          protocol: TCP
        securityContext:
          privileged: true  # 可能需要
        env:
        - name: MODE
          value: standalone
        - name: PREFER_HOST_MODE
          value: hostname
        - name: NACOS_AUTH_ENABLE
          value: "false"
        - name: TIME_ZONE
          value: Asia/Shanghai
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        # 存活检查
        livenessProbe:
          httpGet:
            path: /nacos/actuator/health
            port: 8848
          initialDelaySeconds: 60  # 增加初始延迟
          periodSeconds: 30
          failureThreshold: 5      # 增加失败阈值
          timeoutSeconds: 10
        # 就绪检查
        readinessProbe:
          httpGet:
            path: /nacos/actuator/health
            port: 8848
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        # 生命周期钩子，优雅关闭
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "curl -X POST http://localhost:8848/nacos/v1/ns/instance/beat"]
